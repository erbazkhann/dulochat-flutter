name: Build Dulochat APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create the Android part (first time only)
        run: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.dulochat --project-name dulochat .; fi
          node scripts/patch-android.mjs
      - name: Packages
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Dulochat-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
